name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:words
      - run: npm run lint
      - run: npm test
      - run: npm run build
  # The demo is published as a gh-pages branch that GitHub Pages serves: no Pages artifact,
  # whose lookup by actions/deploy-pages failed about one merge in two on 2026-11-24.
  pages:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions: { contents: write }
    # One publication at a time: merges in a row queue up instead of colliding.
    concurrency: { group: pages, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:demo
      # One more commit on gh-pages per publication (fast-forward, history kept).
      - name: Publish demo-dist to the gh-pages branch
        working-directory: demo-dist
        env: { TOKEN: '${{ github.token }}' }
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin gh-pages; then git reset -q --soft FETCH_HEAD; fi
          git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q --allow-empty -m "Demo of ${GITHUB_SHA::7}"
          git push -q origin HEAD:gh-pages
